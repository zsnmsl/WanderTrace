apply plugin: 'com.android.application'

android {
    namespace 'com.wandertrace'
    compileSdk 37

    defaultConfig {
        applicationId "com.wandertrace"
        minSdk 27
        targetSdk 34
        versionCode 11
        versionName "2.4.1-mapfix"
    }

    signingConfigs {
        release {
            if (System.getenv('WANDERTRACE_RELEASE_KEYSTORE')) {
                storeFile file(System.getenv('WANDERTRACE_RELEASE_KEYSTORE'))
                storePassword System.getenv('WANDERTRACE_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('WANDERTRACE_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('WANDERTRACE_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('WANDERTRACE_RELEASE_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig = true }
}

// Generated native libraries are not committed. Fail clearly instead of producing
// an APK without the system sensor implementation after a fresh checkout.
tasks.register('checkNativeLibrary') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libwander_native.so').isFile()) {
            throw new GradleException('Native library missing. Run scripts/build-native.ps1 -NdkRoot <Android NDK r27d> before building the app.')
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkNativeLibrary' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
}
