name: Feature request
description: Suggest an improvement to WanderTrace.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result and any alternatives you considered.
    validations:
      required: true
